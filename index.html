<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SikaPOS - Akoma Commerce Cloud</title>
  <meta name="description" content="Multi-tenant SaaS Cloud POS & Inventory System tailored for Ghanaian & West African SMB Retailers.">
  <meta property="og:title" content="SikaPOS - Akoma Commerce Cloud">
  <meta property="og:description" content="Multi-tenant SaaS Cloud POS & Inventory System tailored for Ghanaian & West African SMB Retailers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#0D5C3A',
              'primary-hover': '#09432A',
              secondary: '#D97706',
              subtle: '#E8F5EE'
            },
            surface: {
              canvas: '#F8FAFC',
              card: '#FFFFFF',
              subtle: '#F1F5F9'
            }
          },
          fontFamily: {
            sans: ["'Plus Jakarta Sans'", 'system-ui', 'sans-serif'],
            mono: ["'JetBrains Mono'", 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 48px);
      border: none;
    }
  </style>
</head>
<body class="bg-surface-canvas text-slate-900 flex flex-col h-screen">
  <!-- Top Stage 2 Navigator Bar -->
  <header class="h-12 bg-slate-900 text-white flex items-center justify-between px-3 md:px-5 shrink-0 z-50 border-b border-slate-800 select-none">
    <div class="flex items-center gap-2 md:gap-3">
      <div class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="font-bold text-sm tracking-tight text-white">SikaPOS</span>
        <span class="hidden sm:inline-block text-[10px] uppercase tracking-wider bg-emerald-950 text-emerald-300 font-semibold px-2 py-0.5 rounded border border-emerald-800/60">Stage 2 Screens</span>
      </div>
    </div>

    <!-- Screen Navigation Switcher -->
    <nav class="flex items-center gap-1 bg-slate-800/80 p-1 rounded-lg text-xs font-medium" id="screenTabs">
      <button onclick="switchScreen('signup')" id="tab-signup" class="px-2.5 py-1 rounded transition-all bg-emerald-600 text-white font-semibold flex items-center gap-1">
        <span class="material-symbols-outlined text-[14px]">how_to_reg</span>
        <span class="hidden md:inline">1. Merchant Signup</span>
        <span class="md:hidden">1. Signup</span>
      </button>
      <button onclick="switchScreen('wizard')" id="tab-wizard" class="px-2.5 py-1 rounded transition-all text-slate-300 hover:text-white hover:bg-slate-700/60 flex items-center gap-1">
        <span class="material-symbols-outlined text-[14px]">storefront</span>
        <span class="hidden md:inline">2. Store Setup</span>
        <span class="md:hidden">2. Setup</span>
      </button>
      <button onclick="switchScreen('readiness')" id="tab-readiness" class="px-2.5 py-1 rounded transition-all text-slate-300 hover:text-white hover:bg-slate-700/60 flex items-center gap-1">
        <span class="material-symbols-outlined text-[14px]">rocket_launch</span>
        <span class="hidden md:inline">3. PIN & Readiness</span>
        <span class="md:hidden">3. PIN</span>
      </button>
      <button onclick="switchScreen('login')" id="tab-login" class="px-2.5 py-1 rounded transition-all text-slate-300 hover:text-white hover:bg-slate-700/60 flex items-center gap-1">
        <span class="material-symbols-outlined text-[14px]">dialpad</span>
        <span class="hidden md:inline">4. Cashier Login & OTP</span>
        <span class="md:hidden">4. Login</span>
      </button>
    </nav>

    <!-- Quick Actions -->
    <div class="flex items-center gap-2">
      <a id="standaloneLink" href="/merchant_signup_welcome/code.html" class="hidden sm:inline-flex items-center gap-1 text-[11px] text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded border border-slate-700 transition-colors" title="Open current screen in standalone view">
        <span class="material-symbols-outlined text-[13px]">open_in_new</span>
        <span>Standalone</span>
      </a>
    </div>
  </header>

  <!-- Approved Stitch Screen Frame -->
  <main class="flex-1 w-full relative bg-slate-100">
    <iframe id="screenFrame" src="/merchant_signup_welcome/code.html" title="SikaPOS Approved Stitch Screen"></iframe>
  </main>

  <script>
    const screens = {
      signup: {
        path: '/merchant_signup_welcome/code.html',
        title: 'Merchant Signup & Welcome'
      },
      wizard: {
        path: '/business_store_setup_wizard/code.html',
        title: 'Store Setup Wizard'
      },
      readiness: {
        path: '/cashier_pin_launch_readiness/code.html',
        title: 'Cashier PIN & Launch Readiness'
      },
      login: {
        path: '/cashier_pin_login_otp_verification/code.html',
        title: 'Cashier PIN Login & OTP Verification'
      }
    };

    function switchScreen(key) {
      const screen = screens[key];
      if (!screen) return;

      const frame = document.getElementById('screenFrame');
      const standaloneLink = document.getElementById('standaloneLink');

      frame.src = screen.path;
      if (standaloneLink) {
        standaloneLink.href = screen.path;
      }

      // Update active tab styling
      Object.keys(screens).forEach(k => {
        const tab = document.getElementById(`tab-${k}`);
        if (tab) {
          if (k === key) {
            tab.className = 'px-2.5 py-1 rounded transition-all bg-emerald-600 text-white font-semibold flex items-center gap-1 shadow-sm';
          } else {
            tab.className = 'px-2.5 py-1 rounded transition-all text-slate-300 hover:text-white hover:bg-slate-700/60 flex items-center gap-1';
          }
        }
      });

      // Update hash without scrolling
      history.replaceState(null, '', '#' + key);
    }

    // Handle hash on initial load
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && screens[hash]) {
        switchScreen(hash);
      }
    });

    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && screens[hash]) {
        switchScreen(hash);
      }
    });
  </script>
</body>
</html>
